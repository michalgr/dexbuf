[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dexbuf"
version = "0.1.0.dev0"
description = "Zero-copy, lazy DEX & Dalvik bytecode reader built on Python's Buffer protocol and typed dataclasses."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [
    { name = "Michal Gregorczyk", email = "michalgr@live.com" },
]
keywords = [
    "dex",
    "dalvik",
    "bytecode",
    "android",
    "zero-copy",
    "buffer",
    "lazy-parsing",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Disassemblers",
    "Topic :: Software Development :: Debuggers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
    "pyrefly",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dexbuf"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "RUF", # ruff-specific rules
]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q"

[tool.pyrefly]
# Static typechecker configuration targeting Python 3.14+
