name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync

      - name: Run ruff linter
        run: uv run ruff check .

      - name: Run ruff format check
        run: uv run ruff format --check .

      - name: Run pyrefly type check
        run: uv run pyrefly check

      - name: Run pytest
        run: uv run pytest

      - name: Run dexdump on K-9 Mail APK and present in CI summary
        run: |
          APK=$(uv run python -c "from tests.helpers import get_k9mail_apk_path; print(get_k9mail_apk_path())")

          {
            echo "## Dexdump Demonstration on K-9 Mail APK"
            echo "Analyzed container: \`$APK\`"
            echo "<details><summary><b>Class Listing Sample (first 30 classes)</b></summary>"
            echo ""
            echo '```'
            uv run dexdump "$APK" --list | head -n 30
            echo '```'
            echo "</details>"
            echo "### Disassembly of \`com.fsck.k9.mail.Address\`"
            echo '```smali'
            uv run dexdump "$APK" -d "com.fsck.k9.mail.Address" | head -n 80
            echo '```'
          } | tee -a $GITHUB_STEP_SUMMARY
